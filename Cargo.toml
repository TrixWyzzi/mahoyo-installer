[package]
name = "mahoyo-installer"
version = "0.2.4"
edition = "2024"
authors = ["Nolua Corp"]
description = "Installateur Mahoyo"

[dependencies]
anyhow = "1"
encoding_rs = "0.8"
fs2 = "0.4"
native-windows-gui = { version = "1.0.13", default-features = false, features = ["file-dialog", "progress-bar", "notice", "image-decoder", "embed-resource"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "native-tls"] }
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_Controls", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
strip = true
